; ============================================================================
;  NFS The Run Definitive Edition (NFSTR-DE)
;  For Need for Speed The Run v1.1.0.0
;
;  The Run shipped locked to 30 FPS. Unlocking it the usual way raises the
;  physics simulation rate, which breaks the engine note, the tyre spray and the
;  QTE button prompts. This mod unlocks the framerate and repairs each of those
;  separately, so you can run 60, 144 or higher and still get the game the
;  developers tuned at 30.
;
;  Defaults are the settings that were tested and work.
; ============================================================================

[MAIN]
; Write NFSTR_DefinitiveEdition.log next to the .asi. Costs nothing and it is
; the first thing to check if something misbehaves.
;
; The log is written next to the .asi. If it never appears, the .asi is not being
; loaded: check that you have an ASI loader, that the file is in the folder your
; loader scans, and that your antivirus has not quarantined it. That last one has
; happened. (0 = Off, 1 = On)
DebugLog = 1


[GAMEPLAY]
; --- Time of day ----------------------------------------------------------
; Every event in The Run is authored at one fixed time of day, so the twentieth
; run down a stretch of road looks exactly like the first.
;
;   0 = Off. The game as shipped.
;   1 = Randomize. A different time of day each time you load a level.
;   2 = Night Run. Night everywhere it exists, for the whole game.
;
; 1 and 2 are alternatives, not a scale — the original tool notes the same thing,
; that its randomizer and its night mode switch each other off.
;
; MODE 1 only ever picks from the times a level actually supports. Not every level
; implements every time of day, and asking for one that was never built gives a
; broken or black scene. So it carries a per-level table of 128 events taken from
; _mRally2's TOD Randomizer, and a level that is not in the table is left exactly
; as the developers set it rather than guessed at.
;
; MODE 2 sets night on everything, which is what the original does — night is the
; one setting nearly every level implements. Two exceptions are honoured: Las
; Vegas East A uses a different preset, and San Francisco Escape is skipped
; entirely because it has no night at all. The original fakes night there with a
; hand-built lighting environment; that part is not ported, so this leaves the
; level alone rather than half-applying it.
;
; Some levels will not visibly change in either mode. Las Vegas Rival Race, Las
; Vegas Alley Escape and Chicago Downtown Escape have overlapping lighting volumes
; that override the setting, and the car-select cutscenes are not covered. That is
; inherited from the original tool and is not a fault in this one.
;
; NOTE: turning this on also disables the out-of-bounds reset and the wrong-way
; respawn, whatever [TRACK_RULES] says. Some presets swap map assets, and those
; volumes are authored against the daytime layout, so they fire where nothing is
; actually wrong. The original tool does the same and lists it as a known issue.
;
; Independent of everything else here. Applies on every difficulty and through the
; challenge series, and changes nothing about how the game plays.
RandomizeTimeOfDay = 0


; --- RUN FOR YOUR LIFE ----------------------------------------------------
; The Run's Extreme difficulty mostly just makes the AI quicker. This turns it
; into something that earns the name: pick Extreme in the game and the mod
; recognises it and hardens the rules on top.
;
; While it is engaged:
;   - The difficulty is renamed in the menus to DEADLY, described as
;     "Run for your life, one mistake and you're dead".
;   - Your car takes damage from half the health it normally would, so the
;     crashes you used to walk away from now end the run. Damage still works
;     normally; you just have half the buffer before you are wrecked.
;   - Drafting builds at HALF rate. The slingshot you get for it is unchanged,
;     so you simply have to hold the slipstream twice as long to earn it. That
;     means sitting square behind a car at speed without losing the line, which
;     is a skill rather than a freebie. Drafting was removed outright at one
;     point and that was wrong for the same reason removing nitrous was: it is a
;     core mechanic, and deleting it takes away a way to show skill rather than
;     demanding one.
;
;     One knock-on, measured rather than assumed: the NITROUS a draft earns is
;     halved too, because the game computes that reward from the same value. It
;     showed up when drafting was disabled outright and draft-earned nitrous
;     disappeared with it. Left as is, since it is consistent — twice as long in
;     the slipstream for the same total. Near misses and the oncoming lane are
;     untouched and still pay in full.
;   - No driving assists. No racing line, no road alignment. The car goes where
;     you point it and nowhere else.
;   - Nitrous stops filling on its own and has to be earned. Near misses, the
;     oncoming lane and drafting still pay in full; sitting still no longer does.
;   - The AI drives better, recharges nitrous twice as fast, and each event's
;     traffic density ceiling is multiplied so busy roads get busier.
;   - The out-of-bounds reset is turned OFF. This is the one rule the mode
;     relaxes rather than tightens, and it is deliberate: with the AI quicker and
;     your car fragile, some events will not be won on the racing line alone. Cut
;     a corner, cross a median, take a route the event never anticipated. The
;     out-of-bounds volume punishes exactly that kind of driving, so leaving it on
;     would close off the only answer the mode leaves you. It comes back the
;     moment you play any other difficulty.
;
; The draft rate and the assists are changed for YOUR car only. Every AI car keeps
; both in full, so each one costs you something instead of quietly handicapping the
; field, which is what the old cheat-table assist patches did.
;
; Nitrous is tuned rather than removed. It was disabled outright at one point and
; that was a mistake: the game is built around it, and several timed and chase
; events are close to unwinnable without it. A difficulty that makes events
; impossible is not a harder game, it is a broken one. The suppression code still
; exists in research/nos.cpp.
;
; THE EXACT NUMBERS, all fixed in the mod and not adjustable here:
;
;     health cap                50      (a ceiling; damage still accumulates)
;     AI skill scale            1.10
;     AI glue scale             0.97
;     AI nitrous recharge       2.00
;     your nitrous recharge     0.12
;     your risky-driving bonus  8.33    (= 1 / 0.12, see below)
;     your nitrous strength     1.12    (the one thing it gives you)
;     your draft build rate     0.50    (slingshot unscaled; see the note above)
;     traffic max density       x2.0    (a multiplier, ceiling only)
;     out-of-bounds reset       off     (see above; [TRACK_RULES] elsewhere)
;
; They are fixed because a difficulty every player can soften to taste is not a
; difficulty. Every one of them has an equivalent in [VEHICLE] and [TRAFFIC] that
; you can set for yourself with this switched off; the mode overrides those while
; it is engaged and hands them back when it is not.
;
; One setting it does NOT touch: PlayerNosBoostScale. That follows [VEHICLE]
; whether the mode is on or off.
;
; It engages only on Extreme. Play Easy, Normal or Hard and nothing changes.
; (0 = Off, 1 = On)
RunForYourLife = 1

[GRAPHICS_FPS]
; Master switch for the framerate system. 0 injects no timing hooks at all and
; the game runs at its stock 30 FPS. (0 = Off, 1 = On)
EnableFramerateUnlocker = 1

; Target framerate. 30, 60, 120, 144, 165, 240, or -1 for uncapped.
; Anything above 30 needs FixEngineAudioSlew and FixKickupParticles below, which are on by default.
FPSLimit = 144

; Unlock the 30 FPS cap on cutscenes, menus, the garage and the car select.
;
; HOW IT WORKS, because it matters. The only lever the engine gives for this is
; the variable simulation tick, and that tick is the root cause of every bug the
; rest of this mod exists to repair: the engine note, the tyre spray, input
; sampling and the chase camera are all tuned against a fixed 30 Hz physics step.
;
; So it is not simply switched on. It is enabled only once you have had no vehicle
; control for a second and a half, and driven back off the instant control
; returns. Driving always keeps the fixed 30 Hz step.
;
; The delay is there because losing control does not mean nothing is being
; simulated. A head-to-head wreck takes control away and then simulates your car
; tumbling — on a variable step that dramatic crash flattens into a gentle slide.
; Crashes and takedowns are short, cutscenes are long, so the wait lets the real
; cutscenes through and keeps crash physics at 30 where it belongs. The trade is
; that a cutscene spends its first moment at 30 before it unlocks.
;
; THE ONE REAL COST is quick-time events. They are no-control moments too, so a
; longer one runs unlocked, and prompts count down against a 30 FPS frame time —
; at 144 they expire faster and the timing is tighter. Play-testing found them
; still perfectly playable, just less forgiving. If you would rather have the
; forgiving timing than the smooth cutscenes, leave this off.
;
; Turning this on necessarily overrides ClampSimRateWhenNoControl for those same
; moments, since the two want opposite things in the same window. Driving is
; unaffected either way.
;
; (0 = Default 30 FPS. 1 = Unlocked during no-control moments only.)
UnlockCutsceneFPS = 0

; The QTE button prompts count down using a timer that assumes 30 FPS, so at
; higher framerates they expire far too quickly to react to. This drops the
; simulation back to 30 whenever you do not have control of the car, which is
; exactly when QTEs and scripted cutscenes play, and restores your target
; framerate the moment you are driving again. Leave this on. (0 = Off, 1 = On)
ClampSimRateWhenNoControl = 1


[HIGH_FPS_FIXES]
; --- Engine audio ---------------------------------------------------------
; Above 30 FPS the engine sound stops following the RPM and drones at a fixed
; pitch. The synth glides from the old pitch to the new one over about 33ms,
; and it restarts that glide every time the requested pitch changes. A glide
; that has just restarted has not moved yet, so at high framerates the pitch
; changes arrive faster than the glide can travel and it never leaves the
; 1000 Hz it starts at. Logging confirmed it: at 144 FPS the requested pitch
; tracked the RPM perfectly while the actual pitch sat frozen at 1000.
;   0 = off, engine audio stays broken above 30 FPS
;   1 = pitch follows the RPM directly. Accurate at every RPM. Recommended.
;   2 = keep the glide and only restart it once it has finished. Sounds right
;       at sustained high RPM but lags through the rev range, so 1 is better.
FixEngineAudioSlew = 1

; --- Kickup particles (snow spray, drift smoke, wet spray, dirt dust) ------
; These effects tell each particle to inherit part of the wheel's own velocity.
; Above 30 FPS that inherited velocity comes out far too large, so the spray
; spawns in the right place and then streaks away sideways or shoots straight up.
; It repeats at the same spot on a track because the direction comes from the
; wheel's motion and the ground there, which is the same every lap.
; This scales the inherited velocity back down. It touches nothing but that one
; value, so it cannot affect the camera, collisions or input. (0 = Off, 1 = On)
FixKickupParticles = 1

; Leave at -1 to work the correction out from your FPSLimit automatically, which
; is what you want. Set a positive number to override it by hand if the automatic
; value overshoots or undershoots: smaller means weaker spray, 1.0 means no
; correction at all. Useful for finding the right value by eye.
KickupVelocityScale = -1


[RENDER]
; Engine render settings the game never exposed. They live in an internal settings
; object that this mod writes directly, so no config file or launch argument is
; involved. Master switch for the section. (0 = Off, 1 = On)
EnableRenderTweaks = 1

; Field of view. The game runs at 48, which is very narrow for a racing game and is
; a large part of why the chase camera feels like it is sitting on the bumper. 60 is
; a comfortable default; higher pulls the car further away and shows more road.
; Set 0 or below to leave the game's own 48 alone.
ForceFov = 60

; The FOV override otherwise applies everywhere, including View Cars where
; the wider view is not wanted. This limits it to when you are
; actually driving and hands the FOV back to the game everywhere else.
; (0 = apply everywhere, 1 = only while driving)
ForceFovOnlyWhileDriving = 1

; Viewport shift, turn this on so you can modify ForceRenderShiftY and ForceRenderShiftX
; turning this on by itself does nothing. (0 = Off, 1 = On)
; NOTE ON FUSIONFIX: if you enable ThirteenAG's FusionFix camera features, set
; [CAMERA] Enable = 0 in its ini before using the viewport shift or roll.
; Both mods steering the same camera at once will fight each other.
ForceRenderShiftEnabled = 0

; Tilts the view up and down at an angle rather than sliding it, so small values go
; a long way. The game itself uses -0.017, which is why this defaults to that: with
; the shift enabled and this left at 0 the camera visibly rides higher than intended.
; Try -0.030 to angle the view down toward the car a little more. This applies to
; EVERY camera, not just the chase cam.
ForceRenderShiftY = -0.017

; Same idea on the horizontal axis. Rarely useful, included for completeness.
ForceRenderShiftX = 0.0

; Rolls the camera. Works whether or not ForceRenderShiftEnabled is on.
ForceRoll = 0.0

; Clears the render target every frame. Without it the minimap can come up glitchy,
; invisible, or missing road segments on some events. (0 = Off, 1 = On)
FixMinimapRendering = 1


[WORLDRENDER]
; Shadow settings the game never exposed. Master switch for this section.
; (0 = Off, 1 = On)
EnableWorldRenderTweaks = 1
; -1 on any value below means leave the game's own setting alone.
;
; These are read once, when the renderer sets up a level, because they decide how
; big the shadow buffers need to be. Changing them does nothing to a race already
; in progress; they take effect from the next event you load.

; Shadow map resolution. The game runs 2048 on highest settings, 512 at other settings. 4096 is visibly
; sharper and is what this ships with. Higher costs performance and video memory.
ShadowmapResolution = 4096

; Shadow filtering. 1 is the game's own value and gives naturally soft shadow
; edges. Anything else, 0 or 2, appears to switch the filtering off, leaving hard
; edges that stay sharp at every distance. Which one you prefer is taste.
ShadowmapQuality = 1

; How far shadows are still drawn. Game default 200. 600 keeps them out to a
; useful distance without a large cost.
ShadowmapViewDistance = 600


[TEXTURE]
; Anisotropic filtering. The game ships at 4 with no menu option for it, and it
; resets itself to 4 every time a level loads, so this is reapplied continuously.
; 16 is the maximum any current GPU offers and costs close to nothing; it sharpens
; the road surface and trackside textures at shallow viewing angles, which is most
; of the road ahead of you. Valid values are 1, 2, 4, 8 and 16.
; -1 leaves the game's own 4 alone.
AnisotropicFiltering = 16


[TRACK_RULES]
; Opt-in rule changes for free roam, experimenting and speedrun timing. These
; change how a race behaves rather than fixing anything, so all ship off.

; Stops the checkpoint countdown from failing you when it runs out.
DisableCheckpointTimer = 0

; Stops the automatic reset when you leave the track boundary.
DisableResetOOB = 0

; Stops the respawn that fires when you drive the wrong way.
DisableWrongWayRespawn = 0


[TRAFFIC]
; Master switch. Off keeps the game's own traffic values. (0 = Off, 1 = On)
EnableTrafficControls = 0

; Traffic density the spawner reads every time it runs. mRally2's research
; table used 0.05. Raise it for busier roads, lower it toward 0 for emptier
; ones. Confirm which direction does what on your build before relying on it.
TrafficDensityScale = 0.05

; Upper limit on the density above, so keep it at or above TrafficDensityScale.
; The research table used 0.15.
;
; Run For Your Life does NOT use this number. It doubles whatever ceiling each
; event was authored with instead, without needing the master switch above
; and without touching TrafficDensityScale, and it overrides this setting while
; engaged.
;
; A fixed value was tried first and was wrong. Forcing every event to 0.25 made
; the sparse ones as congested as the city ones, and traffic that thick takes the
; speed out of the game. A multiplier keeps each event's own character: a quiet
; stretch stays relatively quiet, a busy one gets busier.
;
; The setting here is still an absolute value, used when you drive traffic
; yourself with the master switch above.
TrafficMaxDensity = 0.15

; How many traffic cars may exist at once. The game otherwise compares this
; against 25. More cars cost frames, and past a point the spawner or the
; streamer gives up.
TrafficVehicleLimit = 25


[VEHICLE]
; Removes the driving aids that read the road and correct the car for you: the
; racing-line assist forces and torque, and the road-alignment nudge.
;
; This applies to YOUR car only. Every AI car keeps the assists it had.
;
; That distinction is the whole reason this option was rewritten. It used to be
; thirteen byte patches taken from the community cheat tables, and those did
; something quite different from what their names claimed. The racing-line values
; are shared physics, written for every car with no check for who is driving, so
; patching them mostly degraded the AI. Two of the patches did not disable
; anything at all: they inverted the "is this a human" test, which handed the
; assist to the AI and took it from the player. The net result made races EASIER.
; This version keys on the game's own human-player flag, so only your car is
; affected and the AI drives exactly as it always did.
;
; Expect the car to feel looser until you adjust. Run For Your Life turns this on
; regardless of what is set here. (0 = Off, 1 = On)
DisablePlayerAssists = 0

; Vehicle health. The car starts every event at 100 and the "wrecked" screen fires
; once damage has driven this low enough. Setting a value here holds it there for
; the whole event, so you can crash without being restarted. This is a cheat, not a
; fix, which is why it ships off.
;   -1  = off, damage works normally
;   1000 = effectively unwreckable
; The mod checks that what it found really is a health value before writing, so it
; fails quietly rather than badly. It logs the car it latched onto once it has one,
; and only complains if it never finds one.
VehicleHealth = -1


; --- AI and nitrous scalars -----------------------------------------------
; 1.0 on any of these is the game's own value, so nothing below does anything
; until you change it.
;
; Run For Your Life sets its own values for all of these except the last two, and
; ignores whatever is here while it is engaged. These exist so the same knobs are
; available with the mode switched off.

; How capable the AI is. Higher is faster. mRally2's table forces this scalar to
; 5.0 as an outright cheat, which is far past useful; 1.12 is the tested value.
AiSkillScale = 1.0

; Rubber-banding, the elastic that keeps the pack near you. Below 1.0 loosens it,
; so a good stretch of driving actually earns you a gap.
AiGlueScale = 1.0

; The AI's nitrous refill rate. The game hardcodes this to 1.0 for every AI car,
; so this is an absolute value rather than a multiplier: 2.0 is twice as often.
AiNosRechargeScale = 1.0

; How fast YOUR nitrous refills on its own. Works as a pair with the bonus below.
PlayerNosRechargeScale = 1.0

; The reward for driving dangerously: near misses, the oncoming lane, drafting.
;
; PAIR THESE TWO. The recharge is (base + bonus) x scalar, so turning the recharge
; down on its own quietly starves the rewards as well. Drop one, raise the other:
;
;     PlayerNosRechargeScale = 0.1
;     PlayerNosBonusScale    = 8.33
;
; gives passive accumulation at a tenth while a near miss pays what it always did,
; so the bar stops filling by itself and starts being something you earn. That is
; what Run For Your Life uses. 0.2 and 5.0 is the same trade, gentler.
PlayerNosBonusScale = 1.0

; How hard your nitrous pushes when you use it. Run For Your Life sets 1.12, a
; little more punch to offset how scarce the bar becomes under that mode. It is
; the only thing the mode hands the player rather than takes away.
PlayerNosStrengthScale = 1.0

; Scripted nitrous grants from event scripts. Testing found near misses do NOT use
; this path, so in practice it only affects scripted top-ups. This is the one
; nitrous setting Run For Your Life leaves alone.
PlayerNosBoostScale = 1.0

; How fast YOUR draft meter builds when you sit in a car's slipstream. This does
; NOT touch the slingshot the draft pays out — that stays whatever the game
; authored, so that reward is unchanged and only the time to earn it moves.
;
; It DOES move the nitrous a draft earns, which the game computes from the same
; value. Near misses and the oncoming lane are unaffected.
;
;   1.00 = stock
;   0.50 = twice as long in the slipstream for the same slingshot
;   2.00 = half as long
;
; PLAYER ONLY. AI cars always keep their full slipstream, on every value here.
; Run For Your Life overrides this with 0.50 while it is engaged.
PlayerDraftRateScale = 1.00

[UI_DEBUG]
; Photo mode is missing from the pause menu because its visibility is tied to a
; data source that depended on Autolog, and EA shut Autolog down. This puts the
; entry back.
;
; It targets that one item rather than unhiding everything. Each pause-menu entry
; carries a key for its visibility check, and photo mode's is 0x3FF1B819, so it
; can be forced visible on its own while the QA debug entries stay hidden. The
; option below does it the blunt way and brings back all of them.
;
; Saving is a separate problem and is NOT solved here. The in-game save still
; wants an Autolog sign-in, so use an external screenshot key: Steam's overlay,
; Windows Game Bar, or SpecialK if you already run it. (0 = Off, 1 = On)
AlwaysShowPhotoMode = 1


; Unlock the QA debug menu and every other hidden UI entry, photo mode included.
; Broader than the setting above and only worth turning on if you want the debug
; menus too. (0 = Off, 1 = On)
EnableExtraUIOptions = 0


[DIAGNOSTICS]
; Troubleshooting only, changes nothing in the game. Logs the engine sound
; synth's state about once a second per voice: how often it renders, how many
; samples it is asked for, its pitch values and how fast it reads its sample
; data. Useful for comparing a 30 FPS run against a high framerate one.
; (0 = Off, 1 = On)
LogGinsuDiagnostics = 0

; Nitrous research. Two reports, both read-only.
;
; "NOS award" lines are direct top-ups of the bar, shown as a fraction of a full
; bar before PlayerNosBoostScale is applied. Testing found that near misses
; do NOT produce these, so this path appears to be for scripted grants only.
;
; "NOS fields" lines show the four values that feed the recharge, whenever one of
; them moves: override, bonus, scalar and strength. Since the rewards for risky
; driving are not paid as awards, they must arrive through one of these, and this
; is how to find out which. Drive, take a near miss, and watch which number jumps.
; (0 = Off, 1 = On)
LogNosAwards = 0

; Research aid. Logs the memory address of every Frostbite settings object once per
; run: world render, visual environment, post process, terrain, vegetation, emitters,
; textures, physics, audio and more. Paste one of those addresses into ReClass to
; browse that object's fields live. Nothing is changed, only reported.
; (0 = Off, 1 = On)
LogSettingsContainers = 0
