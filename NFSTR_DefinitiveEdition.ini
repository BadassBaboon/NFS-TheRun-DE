; ============================================================================
;  NFS The Run Definitive Edition (NFSTR-DE)
;  For Need for Speed The Run v1.1.0.0. Runs alongside ThirteenAG's FusionFix.
;
;  The Run shipped locked to 30 FPS. Unlocking it the usual way raises the
;  physics simulation rate, which breaks the engine note, the tyre spray and the
;  QTE button prompts. This mod unlocks the framerate and repairs each of those
;  separately, so you can run 60, 144 or higher and still get the game the
;  developers tuned at 30.
;
;  Defaults are the settings that were tested and work. Everything that changes
;  gameplay rather than fixing it ships turned off.
; ============================================================================

[MAIN]
; Write NFSTR_DefinitiveEdition.log next to the .asi. Costs nothing and it is
; the first thing to check if something misbehaves. (0 = Off, 1 = On)
DebugLog = 1


[GRAPHICS_FPS]
; Master switch for the framerate system. 0 injects no timing hooks at all and
; the game runs at its stock 30 FPS. (0 = Off, 1 = On)
EnableFramerateUnlocker = 1

; Target framerate. 30, 60, 120, 144, 165, 240, or -1 for uncapped.
; Anything above 30 needs FixEngineAudioSlew below, which is on by default.
FPSLimit = 60

; Unlock the 30 FPS cap on cutscenes, menus and the garage.
; Set this to 0 if the pre-rendered intro video crashes on your system.
; (0 = Default 30 FPS, 1 = Unlocked)
UnlockCutsceneFPS = 0

; The QTE button prompts count down using a timer that assumes 30 FPS, so at
; higher framerates they expire far too quickly to react to. This drops the
; simulation back to 30 whenever you do not have control of the car, which is
; exactly when QTEs and scripted cutscenes play, and restores your target
; framerate the moment you are driving again. Leave this on. (0 = Off, 1 = On)
ClampSimRateWhenNoControl = 1


[HIGH_FPS_FIXES]
; --- Engine audio ---------------------------------------------------------
; Above 30 FPS the engine sound stops following the RPM and drones at a fixed
; pitch. The synth glides from the old pitch to the new one over about 33ms,
; and it restarts that glide every time the requested pitch changes. A glide
; that has just restarted has not moved yet, so at high framerates the pitch
; changes arrive faster than the glide can travel and it never leaves the
; 1000 Hz it starts at. Logging confirmed it: at 144 FPS the requested pitch
; tracked the RPM perfectly while the actual pitch sat frozen at 1000.
;   0 = off, engine audio stays broken above 30 FPS
;   1 = pitch follows the RPM directly. Accurate at every RPM. Recommended.
;   2 = keep the glide and only restart it once it has finished. Sounds right
;       at sustained high RPM but lags through the rev range, so 1 is better.
FixEngineAudioSlew = 1

; --- Kickup particles (snow spray, drift smoke, wet spray, dirt dust) ------
; These effects tell each particle to inherit part of the wheel's own velocity.
; Above 30 FPS that inherited velocity comes out far too large, so the spray
; spawns in the right place and then streaks away sideways or shoots straight up.
; It repeats at the same spot on a track because the direction comes from the
; wheel's motion and the ground there, which is the same every lap.
; This scales the inherited velocity back down. It touches nothing but that one
; value, so it cannot affect the camera, collisions or input. (0 = Off, 1 = On)
FixKickupParticles = 1

; Leave at -1 to work the correction out from your FPSLimit automatically, which
; is what you want. Set a positive number to override it by hand if the automatic
; value overshoots or undershoots: smaller means weaker spray, 1.0 means no
; correction at all. Useful for finding the right value by eye.
KickupVelocityScale = -1

[RENDER]
; Engine render settings the game never exposed. They live in an internal settings
; object that this mod writes directly, so no config file or launch argument is
; involved. Master switch for the section. (0 = Off, 1 = On)
EnableRenderTweaks = 1

; Field of view. The game runs at 48, which is very narrow for a racing game and is
; a large part of why the chase camera feels like it is sitting on the bumper. 60 is
; a comfortable default; higher pulls the car further away and shows more road.
; Set 0 or below to leave the game's own 48 alone.
ForceFov = 60

; The FOV override otherwise applies everywhere, including the garage, My Cars and
; car select, where the wider view is not wanted. This limits it to when you are
; actually driving and hands the FOV back to the game everywhere else.
; (0 = apply everywhere, 1 = only while driving)
ForceFovOnlyWhileDriving = 1

; --- Viewport shift -------------------------------------------------------
; Turning this on by itself raises the chase camera's viewport slightly, which reads
; as a higher camera without changing anything else. It also gates the two offsets
; below, which do nothing while it is off. (0 = Off, 1 = On)
ForceRenderShiftEnabled = 0

; Tilts the view up and down at an angle rather than sliding it, so small values go
; a long way. The game itself uses -0.017, which is why this defaults to that: with
; the shift enabled and this left at 0 the camera visibly rides higher than intended.
; Try -0.030 to angle the view down toward the car a little more. This applies to
; EVERY camera, not just the chase cam.
ForceRenderShiftY = -0.017

; Same idea on the horizontal axis. Rarely useful, included for completeness.
ForceRenderShiftX = 0.0

; Rolls the camera. Works whether or not ForceRenderShiftEnabled is on.
ForceRoll = 0.0

; --- Fixes ----------------------------------------------------------------
; Clears the render target every frame. Without it the minimap can come up glitchy,
; invisible, or missing road segments on some events. (0 = Off, 1 = On)
FixMinimapRendering = 1


[WORLDRENDER]
; Shadow, motion blur and anti-aliasing settings the game never exposed. Master
; switch for this section. (0 = Off, 1 = On)
EnableWorldRenderTweaks = 0

; IMPORTANT: most of these are read once, when the renderer sets up a level, because
; they decide how big the shadow and anti-aliasing buffers need to be. Changing them
; will not do anything to a race already in progress. Set them here and they are in
; place before the next event loads. Raising them costs performance and, pushed far
; enough, can exhaust video memory, so move in small steps.
;
; -1 on any value below means leave the game's own setting alone.

; Shadow map resolution. The game runs 512, which is why shadows are so blocky.
; 1024 is a large visible improvement, 2048 is sharper again and costs more.
ShadowmapResolution = -1

; Shadow filtering quality. Game default 1.
ShadowmapQuality = -1

; Number of cascade slices. Game default 33.
ShadowmapSliceCount = -1

; How far shadows are still drawn. Game default 200.
ShadowmapViewDistance = -1

; Anti-aliasing sample count. Game default 1, meaning off. 2 or 4 enable MSAA if the
; renderer supports it here. This one allocates buffers, so it is the most likely to
; misbehave; try it before you trust it.
MultisampleCount = -1

; Motion blur. -1 leaves it alone, 0 turns it off, 1 turns it on. Game default is on.
MotionBlurEnable = -1
; Strength. Game default 0.2. Lower is subtler, 0 is effectively off.
MotionBlurScale = -1
; Quality level, game default 1, and sample count, game default 5. More samples means
; smoother blur for more cost.
MotionBlurQuality = -1
MotionBlurMaxSampleCount = -1


; NOTE ON FUSIONFIX: if you enable ThirteenAG's FusionFix camera features, set
; [CAMERA] Enable = 0 in its ini before using the viewport shift or roll above.
; Both mods steering the same camera at once will fight each other.


[UI_DEBUG]
; Unlock the QA debug menu, photo mode and other hidden UI entries.
; (0 = Off, 1 = On)
EnableExtraUIOptions = 1


[TRACK_RULES]
; Opt-in rule changes for free roam, experimenting and speedrun timing. These
; change how a race behaves rather than fixing anything, so all ship off.
; Stops the checkpoint countdown from failing you when it runs out.
DisableCheckpointTimer = 0
; Stops the automatic reset when you leave the track boundary.
DisableResetOOB = 0
; Stops the respawn that fires when you drive the wrong way.
DisableWrongWayRespawn = 0


[TRAFFIC]
; Master switch. Off keeps the game's own traffic values. (0 = Off, 1 = On)
EnableTrafficControls = 0

; Traffic density the spawner reads every time it runs. mRally2's research
; table used 0.05. Raise it for busier roads, lower it toward 0 for emptier
; ones. Confirm which direction does what on your build before relying on it.
TrafficDensityScale = 0.05

; Upper limit on the density above, so keep it at or above TrafficDensityScale.
; The research table used 0.15.
TrafficMaxDensity = 0.15

; How many traffic cars may exist at once. The game otherwise compares this
; against 25. More cars cost frames, and past a point the spawner or the
; streamer gives up.
TrafficVehicleLimit = 25


[VEHICLE]
; Removes the driving aids that read the road and correct the car for you.
; With these off the car does what your inputs say and nothing else, so it
; will feel looser until you adjust. Both ship off.
;
; Basic: turns off the drift-intent and racing-line analyzers, the extra
; cornering forces, and sets the racing-line assist to Off. Five patches.
DisableBasicVehicleAssists = 0
; All: everything in Basic, plus the drift assist forces, the racing-line and
; drift-intent calculations, road alignment, drift-intent override and
; wallride protection. Thirteen patches. Overrides Basic when set.
DisableAllVehicleAssists = 0


[DIAGNOSTICS]
; Troubleshooting only, changes nothing in the game. Logs the engine sound
; synth's state about once a second per voice: how often it renders, how many
; samples it is asked for, its pitch values and how fast it reads its sample
; data. Useful for comparing a 30 FPS run against a high framerate one.
; (0 = Off, 1 = On)
LogGinsuDiagnostics = 0

; Research aid. Logs the memory address of every Frostbite settings object once per
; run: world render, visual environment, post process, terrain, vegetation, emitters,
; textures, physics, audio and more. Paste one of those addresses into ReClass to
; browse that object's fields live. Nothing is changed, only reported.
; (0 = Off, 1 = On)
LogSettingsContainers = 0
